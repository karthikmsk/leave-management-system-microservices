spring.application.name=leave-service

server.port=8087

# =========================
# Eureka Configuration
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# PostgreSQL Configuration
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/lms_leave
spring.datasource.username=postgres
spring.datasource.password=K@rthikms@2
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect (optional in Spring Boot 3)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Spring Security
# =========================
#spring.security.user.name=admin
#spring.security.user.password=A@dmin9110

jwt.secret=MyVerySecretKeyForLeaveManagementSystemSpringBootProject2026
jwt.expiration=86400000

logging.level.org.springframework.security=TRACE
logging.level.com.leave_service=DEBUG

logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.feign=DEBUG
logging.level.com.leave_service.client=DEBUG

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Optional - include Java type information in Kafka message
spring.kafka.producer.properties.spring.json.add.type.headers=false