spring.application.name=API-Gateway
server.port=8000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# USER SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://lms-user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# AUTH - USER SERVICEserver.webflux.
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://lms-user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

# LEAVE SERVICEserver.webflux.
spring.cloud.gateway.server.webflux.routes[2].id=leave-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://leave-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/leaves/**

# NOTIFICATION SERVICserver.webflux.E
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# CORS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty.http.server=DEBUG
logging.level.org.springframework.cloud.gateway=TRACE