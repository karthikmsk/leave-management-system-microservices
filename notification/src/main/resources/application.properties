spring.application.name=NOTIFICATION-SERVICE
server.port=8089


# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=K@rthikms@2
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=MyVerySecretKeyForLeaveManagementSystemSpringBootProject2026
jwt.expiration=86400000

spring.kafka.bootstrap-servers=localhost:29092

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust our event package
spring.kafka.consumer.properties.spring.json.trusted.packages=notification.kafka.event

# Tell Kafka what Java class the JSON represents
spring.kafka.consumer.properties.spring.json.value.default.type=notification.kafka.event.LeaveEvent